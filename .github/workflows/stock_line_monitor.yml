name: 📲 最高指揮官專屬 LINE 智慧盯盤推播

on:
  schedule:
    # 台灣時間週一至週五 12:40 (UTC 04:40) 尾盤黃金作戰推播
    - cron: '40 4 * * 1-5'
    # 台灣時間週一至週五 13:15 (UTC 05:15) 盤中最後出場確認推播
    - cron: '15 5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 後台一鍵手動觸發測試

jobs:
  line-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 檢出程式碼庫
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝必要相依套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 執行 LINE 智慧盯盤與尾盤作戰推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_ENABLED: "true"
        run: |
          python scripts/line_monitor.py --mode tail
